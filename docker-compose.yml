# NOTE: This docker-compose file is for local development environment only.

services:
  app:
    profiles: ['devcontainer']
    container_name: new-service-dev
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
    stdin_open: true
    tty: true
    environment:
      DEVCONTAINER: '1'
