packages:
  - apps/*

allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  bcrypt: true
  prisma: true
  sharp: true
  sqlite3: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - nestjs-pino
  - prisma
  - protobufjs
