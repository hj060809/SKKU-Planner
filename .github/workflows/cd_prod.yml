name: CD

on:
  workflow_dispatch:
      inputs:
         logLevel:
            description: 'Log level'
            required: true
            default: 'warning'
         tags:
            description: 'Deply to Production'

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          context: .
          file: ./apps/frontend/Dockerfile # build with root context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/skkuduler-frontend:latest #${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ADMIN_GRAPHQL_ENDPOINT=https://skkuduler.duckdns.org:4001/graphql
            CLIENT_GRAPHQL_ENDPOINT=https://skkuduler.duckdns.org:4000/graphql

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [admin, client] # 'admin'과 'client' 작업을 생성

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          file: ./apps/backend/Dockerfile # build with root context
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/skkuduler-backend-${{ matrix.target }}:latest #${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TARGET=${{ matrix.target }}

  deploy-frontend:
    name: Deploy Frontend
    needs: [build-frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Connect to VM and Run Docker Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/skkuduler-frontend:latest"
            CONTAINER_NAME="Skkuduler-Frontend"

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling latest image: $IMAGE_NAME"
            docker pull $IMAGE_NAME

            if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
                echo "Stopping and removing existing container: $CONTAINER_NAME"
                docker stop $CONTAINER_NAME
                docker rm $CONTAINER_NAME
            fi

            echo "Starting new container: $CONTAINER_NAME"
            docker run -d -p 127.0.0.1:3000:3000 -e NODE_ENV=production -e ADMIN_GRAPHQL_ENDPOINT=https://skkuduler.duckdns.org:4001/graphql -e CLIENT_GRAPHQL_ENDPOINT=https://skkuduler.duckdns.org:4000/graphql --name $CONTAINER_NAME --restart always $IMAGE_NAME

  deploy-backend:
    name: Deploy Backend
    needs: [build-backend]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - env_name: admin
            target: admin
            outer_port: 5001
            inner_port: 4001
          - env_name: client
            target: client
            outer_port: 5000
            inner_port: 4000

    steps:
      - name: Connect to VM and Run Docker Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/skkuduler-backend-${{ matrix.target }}:latest"
            CONTAINER_NAME="Skkuduler-Backend-${{ matrix.target }}"

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Pulling latest image: $IMAGE_NAME"
            docker pull $IMAGE_NAME

            if [ "$(docker ps -aq -f name=$CONTAINER_NAME)" ]; then
                echo "Stopping and removing existing container: $CONTAINER_NAME"
                docker stop $CONTAINER_NAME
                docker rm $CONTAINER_NAME
            fi

            echo "Starting new container: $CONTAINER_NAME"
            docker run -d -p 127.0.0.1:${{ matrix.outer_port }}:${{ matrix.inner_port }} -e NODE_ENV=production -e FRONTEND_URL=${{ secrets.FRONTEND_URL }} -e PEPPER=${{ secrets.PEPPER }} -e DATABASE_URL=${{ secrets.DATABASE_URL }} -e DIRECT_URL=${{ secrets.DIRECT_URL }} -e ADMIN_PORT=${{ secrets.ADMIN_PORT }} -e CLIENT_PORT=${{ secrets.CLIENT_PORT }} --name $CONTAINER_NAME --restart always $IMAGE_NAME
