name: CD

on:
  workflow_run:
    workflows: ["CI"] # 'ci.yml'의 name 값
      types:
        - completed
      branches:
        - prod

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    name: Build Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [admin, client] # 'admin'과 'client' 작업을 생성

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          file: ./apps/backend/Dockerfile # build with root context
          push: true
          tags: ghcr.io/hj060809/skkuduler-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            TARGET=${{ matrix.target }}

  build-frontend:
    name: Build Frontend
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          file: ./apps/frontend/Dockerfile # build with root context
          push: true
          tags: ghcr.io/hj060809/skkuduler-frontend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ADMIN_GRAPHQL_ENDPOINT=https://skkuduler.duckdns.org/graphql
            CLIENT_GRAPHQL_ENDPOINT=https://skkuduler.duckdns.org/graphql